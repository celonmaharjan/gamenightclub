# Runs the test suite on every push and pull request.
name: tests
on: [push, pull_request]
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node game-night-tests/logic.test.js
      - run: node game-night-server/server.test.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node game-night-tests/smoke.js
        env: { CHROME: google-chrome }
      - run: node game-night-tests/mobile.test.js
        env: { CHROME: google-chrome }
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node game-night-tests/online.test.js
        env: { CHROME: google-chrome }
