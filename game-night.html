<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1340">
<title>Game Night</title>
<style>
/* =====================================================================
   GAME NIGHT — styles
   1. Base / theme   2. Shared UI (buttons, bars, modal, toast, dice)
   3. Menu           4. Per-game styles
   ===================================================================== */

/* ---------- 1. Base / theme ---------- */
:root{
  --bg1:#1b1340; --bg2:#0f1b3d; --ink:#f6f4ff; --mute:#b9b4d9; --accent:#ffb703;
  --glass:#ffffff14; --glass2:#ffffff24; --line:#ffffff26;
  --c0:#ef4444; --c1:#22c55e; --c2:#eab308; --c3:#3b82f6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1100px 700px at 8% -10%,#6d3ee066,transparent),
             radial-gradient(900px 600px at 110% 8%,#0ea5e944,transparent),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.hidden{display:none!important}
.hint{color:var(--mute);font-size:13px;margin:4px 0;text-align:center}

/* ---------- 2. Shared UI ---------- */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:16px;color:#1a1033;
  background:linear-gradient(180deg,#ffd166,#ffb703);box-shadow:0 4px 0 #b9770e,0 8px 16px #0005;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9770e}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:60;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:#0006;backdrop-filter:blur(6px);font-size:20px;display:grid;place-items:center}
.screen{max-width:900px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 30px}
.bar{display:flex;align-items:center;gap:10px;padding-right:50px}
.bar h2{margin:0;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turnbar{display:flex;align-items:center;gap:10px;margin:12px auto 6px;padding:8px 16px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);width:fit-content;max-width:100%;font-weight:700}
.turnbar .dot{width:16px;height:16px;border-radius:50%;background:#888;box-shadow:0 0 0 3px #fff3,0 0 12px currentColor;flex:none;transition:background .3s}
.turnbar small{color:var(--mute);font-weight:500}
.stage{--bs:max(280px,min(94vw,calc(100vh - 250px),560px));display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--glass2);border-color:#fff8;box-shadow:0 0 12px #fff4}
.chip .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot{display:inline-block}

.overlay{position:fixed;inset:0;z-index:100;background:#050217b8;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.sheet{width:min(100%,420px);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#2b1d63,#18285a);border:1px solid var(--line);
  border-radius:24px;padding:22px;box-shadow:0 20px 60px #000a;animation:pop .25s}
.sheet h3{margin:0 0 12px;font-size:22px}
.sheet label{font-size:13px;color:var(--mute);display:block;margin:12px 0 6px}
.sheet input[type=text]{width:100%;margin:4px 0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#0004;color:var(--ink);font-size:16px}
.seg{display:flex;gap:6px;background:#0004;padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:11px;font-weight:700;font-size:14px}
.seg button.on{background:linear-gradient(180deg,#8b5cf6,#6d28d9);box-shadow:0 2px 8px #0006}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.winner{text-align:center}
.winner .big{font-size:64px;animation:bounce 1s infinite alternate}
.winner h3{font-size:26px}
.winner p{color:var(--mute);margin:6px 0 0}
#toasts{position:fixed;left:0;right:0;top:64px;z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#111827ee;color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 20px #0008;animation:pop .2s;transition:opacity .35s,transform .35s;max-width:92vw;text-align:center}
.toast.out{opacity:0;transform:translateY(-8px)}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:130;pointer-events:none}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
@keyframes bounce{to{transform:translateY(-10px) rotate(6deg)}}
@keyframes pulse{to{transform:scale(1.14)}}

/* Dice (shared by Ludo and Snakes & Ladders) */
.dice{--dc:#fff;flex:none;width:64px;height:64px;border-radius:16px;border:0;padding:8px;background:linear-gradient(145deg,#fff,#e5e7eb);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);box-shadow:0 5px 0 #9ca3af,0 10px 18px #0006;position:relative;transition:transform .15s;touch-action:manipulation}
.dice::after{content:'';position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 3px var(--dc);opacity:.9;pointer-events:none}
.dice i{width:78%;height:78%;margin:auto;border-radius:50%;background:transparent}
.dice i.on{background:#1f2937;box-shadow:inset 0 2px 3px #000a}
.dice.ready{animation:ring 1.3s ease-out infinite}                 /* your turn: a pulsing ring in your colour */
.dice.ready:active{transform:translateY(3px) scale(.97)}
.dice.rolling{animation:tumble .32s linear infinite}
.dice.land{animation:land .35s ease-out}
@keyframes ring{0%{box-shadow:0 5px 0 #9ca3af,0 0 0 0 var(--dc)}70%{box-shadow:0 5px 0 #9ca3af,0 0 0 14px transparent}100%{box-shadow:0 5px 0 #9ca3af,0 0 0 0 transparent}}
@keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(.85) translateY(-7px)}50%{transform:rotate(180deg) scale(1)}75%{transform:rotate(270deg) scale(.85) translateY(-7px)}100%{transform:rotate(360deg) scale(1)}}
@keyframes land{0%{transform:scale(1.25)}60%{transform:scale(.93)}100%{transform:scale(1)}}
/* Dice tray: pinned to the bottom of the screen so the dice is always reachable, tinted with the current player's colour */
.dicebar{--dc:#fff;position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:14px;
  width:min(100%,560px);margin:12px auto 8px;padding:10px 16px 10px 12px;border-radius:20px;background:#0d0b26f0;backdrop-filter:blur(10px);
  border:1px solid var(--line);border-left:6px solid var(--dc);box-shadow:0 10px 30px #000a}
.dicebar .info{flex:1;min-width:0;font-size:15px;font-weight:700;color:#fff;line-height:1.3}
.dicebar .val{flex:none;min-width:34px;font-size:32px;font-weight:900;text-align:center;color:var(--dc);text-shadow:0 2px 10px #000c}
body:has(#chatbtn:not(.hidden)) .dicebar{width:min(calc(100% - 64px),560px);margin-left:0}   /* leave room for the 💬 button online */

/* ---------- 3. Menu ---------- */
.hero{text-align:center;padding:30px 0 18px}
.hero h1{margin:0;font-size:clamp(40px,11vw,68px);letter-spacing:-1px;background:linear-gradient(90deg,#ffd166,#ff7eb6,#7dd3fc,#ffd166);background-size:200% auto;animation:shine 5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:8px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:12px}
.gcard{position:relative;overflow:hidden;animation:cardin .55s both;animation-delay:calc(var(--i)*80ms);border:0;text-align:left;padding:16px 16px 14px;border-radius:22px;color:#fff;display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 10px 26px #0006,inset 0 1px 0 #fff4;transition:transform .15s}
.gcard:hover,.gcard:focus-visible{transform:translateY(-5px) rotate(-.6deg)}
.gcard .ico{font-size:46px;line-height:1.1;filter:drop-shadow(0 4px 4px #0004)}
.gcard strong{font-size:19px;margin-top:4px}
.gcard small{opacity:.92;font-size:13px;line-height:1.3}
.gcard em{font-style:normal;font-size:12px;opacity:.85;margin-top:6px;background:#0003;border-radius:999px;padding:3px 9px;width:fit-content}
.badge{position:absolute;top:10px;right:10px;background:#fff;color:#111;font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:26px}

/* ---------- 4a. Tic-Tac-Toe ---------- */
.ttt{width:min(86vw,360px);aspect-ratio:1;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);gap:9px}
.ttt-cell{border:0;border-radius:18px;background:var(--glass2);font-size:clamp(44px,16vw,84px);font-weight:900;line-height:1;box-shadow:inset 0 -4px 0 #0003;transition:background .2s,transform .1s}
.ttt-cell:not(:disabled):hover{background:#ffffff38}
.ttt-cell:disabled{opacity:1}
.ttt-cell.X{color:#f472b6;animation:pop .2s}.ttt-cell.O{color:#22d3ee;animation:pop .2s}
.ttt-cell.win{background:#fde04755;animation:pulse .5s infinite alternate}

/* ---------- 4b. Connect Four ---------- */
.c4{width:min(94vw,520px);background:#2563eb;border:8px solid #1d4ed8;border-radius:18px;display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden;box-shadow:0 10px 30px #0008}
.c4-col{display:flex;flex-direction:column;cursor:pointer}
.c4-col:hover{background:#ffffff1c}
.c4-cell{position:relative;aspect-ratio:1}
.c4-cell::before{content:'';position:absolute;inset:8%;border-radius:50%;background:#0b1536;box-shadow:inset 0 4px 8px #000b}
.disc{position:absolute;inset:8%;border-radius:50%;animation:drop calc(.2s + var(--from)*.065s) cubic-bezier(.5,0,.8,.7) both;box-shadow:inset 0 -4px 6px #0004,inset 0 3px 5px #fff5}
.disc.p0{background:radial-gradient(circle at 35% 30%,#fca5a5,#ef4444 55%,#b91c1c)}
.disc.p1{background:radial-gradient(circle at 35% 30%,#fef08a,#facc15 55%,#ca8a04)}
.c4-cell.win .disc{animation:none;outline:4px solid #fff;box-shadow:0 0 18px 6px #fff}
@keyframes drop{0%{transform:translateY(calc(var(--from)*-119%))}78%{transform:none}88%{transform:translateY(-9%)}100%{transform:none}}

/* ---------- 4c. Checkers ---------- */
.ck-board{position:relative;width:var(--bs);aspect-ratio:1;display:grid;grid:repeat(8,1fr)/repeat(8,1fr);border:6px solid #5b3a1e;border-radius:10px;box-shadow:0 10px 30px #0008;overflow:hidden}
.ck-sq{position:relative}
.ck-sq.lt{background:#f1dcb4}.ck-sq.dk{background:#8b5a3c}
.ck-sq.mv::after{content:'';position:absolute;inset:6%;border-radius:50%;border:3px dashed #fde047;animation:pulse .7s infinite alternate}
.ck-sq.sel{box-shadow:inset 0 0 0 4px #fde047}
.ck-sq.tg::after{content:'';position:absolute;inset:34%;border-radius:50%;background:#4ade80cc;box-shadow:0 0 10px #4ade80;animation:pulse .6s infinite alternate}
.ck-layer{position:absolute;inset:0;pointer-events:none}
.ck-pc{position:absolute;width:12.5%;height:12.5%;transition:left .28s ease,top .28s ease}
.ck-pc::before{content:'';position:absolute;inset:11%;border-radius:50%;box-shadow:0 3px 5px #0009,inset 0 -3px 4px #0005,inset 0 3px 3px #fff6}
.ck-pc.p0::before{background:radial-gradient(circle at 35% 30%,#fca5a5,#ef4444 60%,#991b1b)}
.ck-pc.p1::before{background:radial-gradient(circle at 35% 30%,#fff,#e2e8f0 60%,#94a3b8)}
.ck-pc .crown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.42)}
.ck-pc.king .crown{display:flex}
.ck-pc.cap{transform:scale(.2);opacity:0;transition:transform .35s,opacity .35s}

/* ---------- 4d. Ludo ---------- */
.ld-board{position:relative;width:var(--bs);aspect-ratio:1;display:grid;grid:repeat(15,1fr)/repeat(15,1fr);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #0009;border:3px solid #fff}
.ld-cell{border:1px solid #0000001f;background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/15*.7);line-height:1;color:#0000}
.ld-cell.safe::after{content:'★';color:#0000004d}
.ld-cell.home.c0{background:#ef4444}.ld-cell.home.c1{background:#22c55e}.ld-cell.home.c2{background:#eab308}.ld-cell.home.c3{background:#3b82f6}
.ld-cell.st.c0{background:#fca5a5}.ld-cell.st.c1{background:#86efac}.ld-cell.st.c2{background:#fde047}.ld-cell.st.c3{background:#93c5fd}
.ld-cell.st::after{color:#0007}
.ld-base{display:grid;place-items:center}
.ld-base.c0{background:#ef4444}.ld-base.c1{background:#22c55e}.ld-base.c2{background:#eab308}.ld-base.c3{background:#3b82f6}
.ld-base.off{filter:grayscale(.85) brightness(1.15);opacity:.55}
.ld-bin{width:66.7%;aspect-ratio:1;background:#fff;border-radius:16%;display:grid;grid:1fr 1fr/1fr 1fr;place-items:center;box-shadow:inset 0 3px 8px #0004}
.ld-bin i{width:56%;aspect-ratio:1;border-radius:50%;background:#0001;box-shadow:inset 0 2px 4px #0004}
.ld-center{position:relative}
.ld-center svg{position:absolute;inset:0;width:100%;height:100%}
.ld-tokens{position:absolute;inset:0;pointer-events:none}
.tk{--s:1;position:absolute;width:5.6%;aspect-ratio:1;transform:translate(-50%,-50%) scale(var(--s));transition:left .16s linear,top .16s linear,transform .16s;pointer-events:auto}
.tk-i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px #000a,inset 0 -3px 4px #0004;
  background:radial-gradient(circle at 35% 28%,#fffa,transparent 45%),var(--tc)}
.tk.c0{--tc:#ef4444}.tk.c1{--tc:#16a34a}.tk.c2{--tc:#eab308}.tk.c3{--tc:#2563eb}
.tk.blk .tk-i{box-shadow:0 0 0 2px #000,0 2px 5px #000a}
.tk.can{cursor:pointer}
.tk.can .tk-i{animation:pulse .6s infinite alternate;box-shadow:0 0 0 3px #fff,0 0 14px 5px #fde047}

/* ---------- 4e. Snakes & Ladders ---------- */
.sl-wrap{position:relative;width:var(--bs);aspect-ratio:10/11}
.sl-grid{position:absolute;left:0;right:0;top:0;height:calc(100%*10/11);display:grid;grid:repeat(10,1fr)/repeat(10,1fr);border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 10px 30px #0009}
.sl-cell{position:relative;font-size:calc(var(--bs)/10*.26);font-weight:700;padding:2px 3px;color:#0008}
.sl-cell.a{background:#fde68a}.sl-cell.b{background:#a7f3d0}
.sl-cell.big{background:#fca5a5;color:#7f1d1d}
.sl-svg{position:absolute;left:0;top:0;width:100%;height:calc(100%*10/11);pointer-events:none}
.sl-start{position:absolute;left:0;right:0;bottom:0;height:calc(100%/11);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
  font-size:calc(var(--bs)/10*.3);font-weight:800;letter-spacing:2px;color:var(--mute)}
.pawn{position:absolute;width:5.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;color:#fff;font-size:calc(var(--bs)/10*.28);font-weight:900;
  display:grid;place-items:center;transition:left .17s linear,top .17s linear;box-shadow:0 3px 6px #000a,inset 0 -3px 4px #0005;z-index:5;text-shadow:0 1px 2px #0008;
  background:radial-gradient(circle at 35% 28%,#fff9,transparent 45%),var(--pc)}
.pawn.act{z-index:9;animation:hop .5s infinite alternate}
@keyframes hop{to{margin-top:-7px}}

/* ---------- 4f. Card game ---------- */
.cg{width:min(100%,640px);display:flex;flex-direction:column;gap:10px;position:relative}
.cg-scores{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cg-opps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cg-opp{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center;min-width:110px;transition:box-shadow .2s}
.cg-opp.on{box-shadow:0 0 0 2px var(--accent),0 0 16px #ffb70366}
.cg-opp .nm{font-weight:700;font-size:14px}.cg-opp .ct{font-size:12px;color:var(--mute)}
.fan{display:flex;justify-content:center;margin:6px 0 4px;min-height:40px}
.cg-table{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px;border-radius:24px;background:radial-gradient(circle,#15803d,#14532d);box-shadow:inset 0 0 40px #0008;border:3px solid #78350f}
.pile{background:none;border:0;padding:0;position:relative}
.pile .cnt{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#000b;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.pile.glow .pc{box-shadow:0 0 0 3px #fde047,0 0 18px 4px #fde047;animation:pulse .6s infinite alternate}
.suitbadge{position:absolute;right:-12px;top:-12px;background:#fff;color:#111;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 6px #0008;z-index:2}
.suitbadge.red{color:#dc2626}
.disc-wrap{position:relative}
.pc{--cw:clamp(46px,13.5vw,74px);width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.13);background:#fff;color:#111;position:relative;box-shadow:0 2px 6px #0007;
  font-weight:800;flex:0 0 auto;user-select:none;transition:transform .15s,box-shadow .15s}
.pc.red{color:#dc2626}
.pc .cn{position:absolute;font-size:calc(var(--cw)*.26);line-height:1.05;text-align:center}
.pc .cn.tl{top:5%;left:7%}.pc .cn.br{bottom:5%;right:7%;transform:rotate(180deg)}
.pc .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.56)}
.pc.back{background:repeating-linear-gradient(45deg,#4f46e5 0 6px,#6366f1 6px 12px);border:3px solid #fff}
.pc.sm{--cw:clamp(26px,7vw,34px);border-width:2px}
.fan .pc+.pc{margin-left:calc(var(--cw)*-.6)}
.pc.land{animation:land .35s}
.pc.fresh{animation:land .45s}
@keyframes land{from{transform:translateY(-30px) rotate(-12deg) scale(1.2);opacity:.2}}
.hand{display:flex;overflow-x:auto;padding:16px 6px 8px;min-height:calc(clamp(46px,13.5vw,74px)*1.42 + 24px)}
.hand>.pc:first-child{margin-left:auto}.hand>.pc:last-child{margin-right:auto}
.hand>.pc+.pc{margin-left:var(--ov,6px)}
.hand .pc.ok{cursor:pointer;transform:translateY(-12px);box-shadow:0 0 0 3px #fde047,0 6px 14px #0009}
.hand .pc.no{filter:brightness(.78)}
.cg-me{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cg-me .who{font-weight:700}
.last{border:0;border-radius:999px;padding:9px 16px;font-weight:800;background:linear-gradient(180deg,#fb7185,#e11d48);box-shadow:0 3px 0 #9f1239}
.last:disabled{opacity:.35;box-shadow:none}
.last.on{background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 3px 0 #166534}
.cover{position:absolute;left:0;right:0;bottom:0;top:auto;height:calc(clamp(46px,13.5vw,74px)*1.42 + 64px);background:#1b1340f2;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5;border:1px solid var(--line)}
.suitpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.suitpick button{font-size:44px;border:0;border-radius:16px;background:#fff;padding:10px;color:#111}
.suitpick button.red{color:#dc2626}

/* ---------- 5. Polish: ambience, themes, textures ---------- */
.screen,#mute{position:relative;z-index:1}#mute{position:fixed;z-index:60}
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgfx span{position:absolute;bottom:-70px;font-size:var(--s);opacity:.14;animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{to{transform:translateY(-125vh) rotate(360deg)}}
@keyframes shine{to{background-position:200% center}}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.94)}}
.logo{display:inline-block;font-size:60px;line-height:1;animation:bounce 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 8px 10px #0006)}
.gcard>*:not(.ghost):not(.badge){position:relative;z-index:1}
.gcard .ghost{position:absolute;right:-8px;bottom:-16px;font-size:92px;opacity:.2;transform:rotate(-14deg);transition:transform .3s}
.gcard:hover .ghost{transform:rotate(0) scale(1.15)}
.gcard::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff40 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s;z-index:2;pointer-events:none}

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   GAME NIGHT — one file, no dependencies.

   HOW THE CODE IS ORGANISED
     1. Helpers .......... DOM builder h(), RNG, Store (localStorage), Sound (Web Audio)
     2. UI ............... toast, modal, winner screen + confetti
     3. Shared classes ... Dice, Game (base class)
     4. Games ............ one class per game (TicTacToe, ConnectFour, Checkers,
                           Ludo, SnakesLadders, CardGame)
     5. Hub .............. menu, setup sheet, launching games
     6. Boot

   HOW TO ADD A NEW GAME
     a) class MyGame extends Game { static meta = {...}; start(){...} }
        - build your DOM inside this.root, read this.players ({name, cpu}),
          call this.turn(i,'text') to update the turn bar and
          this.finish(title, sub) when somebody wins (it shows confetti + Play Again).
        - use `await this.wait(ms)` (not setTimeout) inside async flows so the
          game stops cleanly when the user leaves, and this.run(fn) to start them.
     b) add MyGame to the GAMES array just before the Hub section. Done.
   ===================================================================== */

/* =====================================================================
   1. HELPERS
   ===================================================================== */
const PALETTE = ['#ef4444', '#22c55e', '#eab308', '#3b82f6'];       // red, green, yellow, blue
const CPU_NAMES = ['Robo', 'Chip', 'Byte'];
const DEAD = Symbol('game-destroyed');                              // thrown to unwind async flows
const QS = new URLSearchParams(typeof location !== 'undefined' ? location.search : '');
const SPEED = Math.max(1, +QS.get('speed') || 1);                    // ?speed=20 shortens waits (used by tests)
const SID = QS.get('sid') || '';                                     // namespaces the saved online session (tests run many "phones" in one tab)
/** Fast-forward: while true every wait is (almost) instant and sound/toasts are off. Used to replay a game after reconnecting. */
let FF = false, ffN = 0;
const sleep = ms => FF ? (++ffN % 120 ? Promise.resolve() : new Promise(r => setTimeout(r, 0))) : new Promise(r => setTimeout(r, ms / SPEED));
/** Game-logic randomness. Online games seed it identically on every client so dice and shuffles match everywhere. */
const RNG = { f: null,
  seed(s) { let a = s >>> 0; this.f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  off() { this.f = null; }, next() { return this.f ? this.f() : Math.random(); } };
const rand = n => Math.floor(RNG.next() * n);
/** Short FNV-1a hash of a string (used to compare game states between online players). */
function hash32(str) { let x = 0x811c9dc5; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 0x01000193); } return (x >>> 0).toString(36); }
const crand = n => Math.floor(Math.random() * n);             // cosmetic randomness only (never touches game state)
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/** Tiny DOM builder: h('div',{class:'x',onclick:fn,style:{...}}, child, child...) */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') {
      for (const [sk, sv] of Object.entries(v)) sk.startsWith('--') ? e.style.setProperty(sk, sv) : (e.style[sk] = sv);
    } else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}

/** Persistent settings (last game, names, mute...) — every access wrapped in try/catch. */
const Store = {
  key: 'gamenight.v1', data: {},
  load() { try { this.data = JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { this.data = {}; } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* private mode etc. */ } },
  get(k, d) { return k in this.data ? this.data[k] : d; },
  set(k, v) { this.data[k] = v; this.save(); }
};

/** Sound effects synthesised with the Web Audio API (no audio files). */
const Sound = {
  ctx: null, muted: false,
  init() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* audio unavailable */ }
  },
  tone(freq, dur = .1, type = 'sine', vol = .15, delay = 0, slideTo = null) {
    if (this.muted || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + .03);
    } catch (e) { /* ignore */ }
  },
  play(name) {
    if (this.muted || FF) return; this.init(); if (!this.ctx) return;
    switch (name) {
      case 'dice': for (let i = 0; i < 9; i++) this.tone(280 + Math.random() * 520, .05, 'square', .06, i * .065); break;
      case 'move': this.tone(560, .07, 'triangle', .14); break;
      case 'click': this.tone(780, .05, 'sine', .1); break;
      case 'drop': this.tone(320, .14, 'sine', .16, 0, 120); this.tone(170, .09, 'sine', .16, .25); break;
      case 'capture': this.tone(430, .3, 'sawtooth', .13, 0, 80); break;
      case 'card': this.tone(220, .05, 'square', .07); this.tone(340, .05, 'square', .05, .03); break;
      case 'ladder': [400, 500, 620, 800].forEach((f, i) => this.tone(f, .1, 'triangle', .15, i * .08)); break;
      case 'snake': this.tone(760, .7, 'sawtooth', .11, 0, 90); break;
      case 'king': [660, 880, 1100].forEach((f, i) => this.tone(f, .12, 'triangle', .15, i * .09)); break;
      case 'home': [523, 784, 1047].forEach((f, i) => this.tone(f, .14, 'triangle', .15, i * .08)); break;
      case 'error': this.tone(140, .18, 'square', .09); break;
      case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .24, 'triangle', .18, i * .12)); break;
    }
  }
};

/** Optional looping background tune (generative, Web Audio). */
Sound.musicOn = false; Sound.mt = null;
Sound.setMusic = function (on) {
  this.musicOn = on; clearInterval(this.mt); this.mt = null; if (!on) return; this.init();
  const notes = [261.6, 329.6, 392, 523.3, 392, 329.6, 293.7, 349.2, 440, 587.3, 440, 349.2, 261.6, 392, 329.6, 246.9]; let i = 0;
  this.mt = setInterval(() => { if (this.muted || !this.ctx) return; const f = notes[i % notes.length]; this.tone(f, .55, 'sine', .04); if (i % 4 === 0) this.tone(f / 2, 1, 'triangle', .045); i++; }, 460);
};

/* =====================================================================
   2. UI — toast, modal, winner screen, confetti
   ===================================================================== */
const UI = {
  toasts: null, cv: null,
  toast(msg, ms = 1700) {
    if (FF) return;
    if (!this.toasts) { this.toasts = h('div', { id: 'toasts' }); document.body.append(this.toasts); }

    this.launch(this.Cls, Object.assign({}, this.cfg, { resume: null }));
  }
  toMenu() {
    this.leaveOnline(); RNG.off(); if (this.game) { this.game.destroy(); this.game = null; } UI.closeAll();
    this.gameEl.classList.add('hidden'); this.menuEl.classList.remove('hidden'); delete document.body.dataset.game; this.buildMenu(); window.scrollTo(0, 0);
  }
}

/* =====================================================================
   6. BOOT
   ===================================================================== */
function boot() {
  window.hub = new Hub(document.getElementById('app'));
  if (/^https?:$/.test(location.protocol)) {                      // installable app + offline single-player (only when served by server.js)
    document.head.append(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }), h('link', { rel: 'apple-touch-icon', href: 'icon-192.png' }),
      h('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' }), h('meta', { name: 'mobile-web-app-capable', content: 'yes' }));
    if ('serviceWorker' in navigator && SPEED === 1) {
      const hadCtl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(reg => { setInterval(() => reg.update().catch(() => {}), 30 * 60000); }).catch(() => { /* optional */ });
      navigator.serviceWorker.addEventListener('controllerchange', () => {               // a new version was installed while the app was open
        if (!hadCtl || document.getElementById('updbtn')) return;
        document.body.append(h('button', { id: 'updbtn', class: 'btn small', onclick: () => location.reload() }, '🔄 New version — tap to update'));
      });
    }
  }
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
}
if (typeof module !== 'undefined' && module.exports) {   // lets the logic be unit-tested in Node
  module.exports = { GAMES, Hub, Game, dbDims, dbPick, dbSides, dbLineBoxes, dbChainGift, slGenerate, tttMinimax, tttWinner, c4Search, c4Find, c4Row, ckGen, ckApply, ckClone, ckSearch, LD_TRACK, LD_HC, LD_ST, LD_SAFE, slXY, SL_SNAKES, SL_LADDERS };
}
